// Fix: Kotlin JVM bytecode-target mismatch.
// Expo modules force kotlinOptions.jvmTarget = "11" while kotlin-stdlib (1.9.23) is
// compiled for JVM 17, causing: "Cannot inline bytecode built with JVM target 17 into
// bytecode that is being built with JVM target 11" (e.g. expo-crypto).
// Aligning all Kotlin compilation tasks (all subprojects) to JVM 17 (matching javac/JDK 17)
// resolves the incompatibility without editing node_modules.
gradle.projectsEvaluated { g ->
    def matcher = { task ->
        try { task.hasProperty('kotlinOptions') && task.kotlinOptions != null } catch (Exception _) { false }
    }
    def projects = g.getRootProject().getAllprojects()
    projects.each { p ->
        p.getTasks().findAll(matcher).each { task ->
            try { task.kotlinOptions.jvmTarget = "17" } catch (Exception _) {}
        }
    }
}